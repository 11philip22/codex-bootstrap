---
- name: Install system packages
  ansible.builtin.package:
    name:
      - nodejs
      - npm
      - python3
      - python3-dev
      - python3-venv
      - python3-gi
      - gir1.2-gtk-3.0
      - gir1.2-xfconf-0
      - rustc
      - cargo
      - rustfmt
      - rust-clippy
      - golang-go
      - build-essential
      - clang
      - cmake
      - pkg-config
      - ripgrep
      - htop
      - deskflow
      - i3lock
      - x11-xserver-utils
      - rxvt-unicode
      - xfonts-terminus
      - samba
      - python3-samba
      - xz-utils
    state: present

- name: Create the shared Neofetch directory
  ansible.builtin.file:
    path: /usr/local/share/neofetch
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the Neofetch logo
  ansible.builtin.copy:
    src: neofetch/pentagram.txt
    dest: /usr/local/share/neofetch/pentagram.txt
    owner: root
    group: root
    mode: '0644'

- name: Install Neofetch
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/dylanaraps/neofetch/7.1.0/neofetch
    dest: /usr/local/share/neofetch/neofetch
    checksum: sha256:3dc33493e54029fb1528251552093a9f9a2894fcf94f9c3a6f809136a42348c7
    owner: root
    group: root
    mode: '0755'

- name: Set the system-wide Neofetch logo
  ansible.builtin.copy:
    dest: /usr/local/bin/neofetch
    content: |
      #!/bin/sh
      exec /usr/local/share/neofetch/neofetch --ascii /usr/local/share/neofetch/pentagram.txt "$@"
    owner: root
    group: root
    mode: '0755'

- name: Install Docker Engine and its CLI
  ansible.builtin.apt:
    name: docker.io
    state: present
    install_recommends: true  # Debian 13 packages the CLI as a recommendation.

- name: Start Docker and enable it at boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Install the OpenAI Codex CLI
  ansible.builtin.command:
    cmd: npm install --global --prefix /usr/local --engine-strict @openai/codex
    creates: /usr/local/bin/codex

- name: Install uv in its own virtual environment
  ansible.builtin.pip:
    name: uv
    state: present
    virtualenv: /opt/uv
    virtualenv_command: /usr/bin/python3 -m venv
    umask: '0022'

- name: Make uv available system-wide
  ansible.builtin.file:
    src: /opt/uv/bin/uv
    dest: /usr/local/bin/uv
    state: link

- name: Read installed Debian packages
  ansible.builtin.package_facts:
    manager: apt

- name: Install the VSCodium repository signing key
  ansible.builtin.get_url:
    url: https://gitlab.com/paulcarroty/vscodium-deb-rpm-repo/raw/master/pub.gpg
    dest: /usr/share/keyrings/vscodium-archive-keyring.asc
    owner: root
    group: root
    mode: '0644'
    force: true

- name: Configure the VSCodium APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/vscodium.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: https://download.vscodium.com/debs
      Suites: vscodium
      Components: main
      Architectures: amd64 arm64
      Signed-By: /usr/share/keyrings/vscodium-archive-keyring.asc

- name: Install VSCodium
  ansible.builtin.apt:
    name: codium
    state: present
    update_cache: "{{ 'codium' not in ansible_facts.packages }}"

- name: Install Google Chrome Stable
  ansible.builtin.apt:
    deb: "https://dl.google.com/linux/direct/google-chrome-stable_current_{{ ansible_facts.packages.dpkg[0].arch }}.deb"
  when: "'google-chrome-stable' not in ansible_facts.packages"
