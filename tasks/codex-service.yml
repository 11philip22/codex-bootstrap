---
- name: Install the Codex app server unit
  ansible.builtin.template:
    src: codex.service.j2
    dest: /etc/systemd/system/codex.service
    owner: root
    group: root
    mode: '0644'
  register: codex_service_unit

- name: Enable and run the Codex app server
  ansible.builtin.systemd:
    name: codex.service
    enabled: true
    daemon_reload: true
    state: "{{ 'restarted' if codex_service_unit.changed else 'started' }}"
