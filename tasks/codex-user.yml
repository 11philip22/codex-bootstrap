---
- name: Ensure the user and home directory exist
  ansible.builtin.user:
    name: "{{ local_username }}"
    state: present
    create_home: true

- name: Grant the local user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-codex-bootstrap
    content: "{{ local_username }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
