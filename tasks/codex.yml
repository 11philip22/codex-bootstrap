---
- name: Configure the Codex login account
  ansible.builtin.user:
    name: "{{ local_username }}"
    state: present
    system: false
    shell: /bin/bash
    create_home: true

- name: Authorize the GitHub account's SSH keys for the Codex user
  ansible.posix.authorized_key:
    user: "{{ local_username }}"
    key: "{{ github_ssh_keys.content }}"
    state: present
    exclusive: false

- name: Grant the local user passwordless sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/99-codex-bootstrap
    content: "{{ local_username }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Create the projects directory for the local user
  ansible.builtin.file:
    path: "{{ projects_dir }}"
    state: directory
    owner: "{{ local_username }}"
    mode: u+rwx

- name: Install the Samba file server configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
    validate: /usr/bin/testparm -s %s
  register: samba_config

- name: Enable and run the Samba file server
  ansible.builtin.systemd:
    name: smbd.service
    enabled: true
    state: "{{ 'restarted' if samba_config.changed else 'started' }}"

- name: Set the shared Linux and Samba password
  codex_passwords:
    username: "{{ local_username }}"
    password: "{{ codex_password }}"
  vars:
    ansible_python_interpreter: /usr/bin/python3
  no_log: true

- name: Install the Codex app server unit
  ansible.builtin.template:
    src: codex.service.j2
    dest: /etc/systemd/system/codex.service
    owner: root
    group: root
    mode: '0644'
  register: codex_service_unit

- name: Read the Codex unit reload state
  ansible.builtin.command: systemctl show --property=NeedDaemonReload --value codex.service
  register: codex_reload_state
  changed_when: false
  check_mode: false
  when: not codex_service_unit.changed

- name: Sign in to Codex as the service user
  codex_device_login:
    user: "{{ local_username }}"
  register: codex_login

- name: Enable and run the Codex app server
  vars:
    codex_reload_needed: "{{ codex_service_unit.changed or codex_reload_state.stdout == 'yes' }}"
  ansible.builtin.systemd:
    name: codex.service
    enabled: true
    daemon_reload: "{{ codex_reload_needed }}"
    state: "{{ 'restarted' if codex_reload_needed or codex_login is changed else 'started' }}"

- name: Wait for the Codex app server
  ansible.builtin.uri:
    url: http://127.0.0.1:4500/readyz
    status_code: 200
    use_proxy: false
    timeout: 3
  register: codex_ready
  until: (codex_ready.status | default(0)) == 200
  retries: 15
  delay: 2
  changed_when: false
  when: not ansible_check_mode
