---
- name: Configure Bash tab completion for the desktop user
  become_user: "{{ local_username }}"
  ansible.builtin.blockinfile:
    path: ~/.bashrc
    create: true
    marker: "# {mark} ANSIBLE MANAGED BLOCK: Bash tab completion"
    block: |
      if [[ $- == *i* ]]; then
          if ! declare -F _completion_loader >/dev/null; then
              . /usr/share/bash-completion/bash_completion
          fi
          bind '"\C-i": menu-complete'
          bind '"\e[Z": menu-complete-backward'
          bind 'set show-all-if-ambiguous on'
      fi

- name: Configure VSCodium for the desktop user
  become_user: "{{ local_username }}"
  block:
    - name: Create the VSCodium user settings directory
      ansible.builtin.file:
        path: ~/.config/VSCodium/User
        state: directory
        mode: '0755'

    - name: Install the VSCodium user settings
      ansible.builtin.copy:
        src: vscodium/settings.json
        dest: ~/.config/VSCodium/User/settings.json
        mode: '0644'

- name: Set the Codex user's global Git identity
  become_user: "{{ local_username }}"
  community.general.git_config:
    scope: global
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: user.name, value: "11philip22" }
    - { name: user.email, value: "philipwoldhek@gmail.com" }

- name: Create the local wallpapers directory
  ansible.builtin.file:
    path: /usr/local/share/backgrounds
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the stars wallpaper
  ansible.builtin.copy:
    src: wallpapers/stars-space.jpg
    dest: /usr/local/share/backgrounds/stars-space.jpg
    owner: root
    group: root
    mode: '0644'

- name: Install the XFCE wallpaper helper
  ansible.builtin.copy:
    src: xfce/set-wallpaper.py
    dest: /usr/local/bin/codex-xfce-wallpaper
    owner: root
    group: root
    mode: '0755'

- name: Install the XFCE idle power settings helper
  ansible.builtin.copy:
    src: xfce/set-idle-power.sh
    dest: /usr/local/bin/codex-xfce-idle-power
    owner: root
    group: root
    mode: '0755'

- name: Enable GTK platform integration for Qt in XFCE X11 sessions
  ansible.builtin.copy:
    dest: /etc/X11/Xsession.d/56codex-xfce-qt-theme
    owner: root
    group: root
    mode: '0644'
    content: |
      case "$BASESTARTUP" in
          startxfce4|xfce4-session|deskflow-locked-xfce)
              export QT_QPA_PLATFORMTHEME=gtk3
              ;;
      esac

- name: Configure the desktop at XFCE login
  become_user: "{{ local_username }}"
  block:
    - name: Create the user's autostart directory
      ansible.builtin.file:
        path: ~/.config/autostart
        state: directory

    - name: Disable light-locker autostart for the desktop user
      ansible.builtin.copy:
        dest: ~/.config/autostart/light-locker.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Light Locker
          Hidden=true

    - name: Set elementary Xfce as the user's icon theme
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-icon-theme.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Set XFCE icon theme
          Exec=xfconf-query -c xsettings -p /Net/IconThemeName --create -t string -s elementary-xfce
          OnlyShowIn=XFCE;

    - name: Set Greybird-dark as the user's GTK theme
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-gtk-theme.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Set XFCE GTK theme
          Exec=xfconf-query -c xsettings -p /Net/ThemeName --create -t string -s Greybird-dark
          OnlyShowIn=XFCE;

    - name: Limit the user's XFCE session to one workspace
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-workspaces.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Set XFCE workspace count
          Exec=xfconf-query -c xfwm4 -p /general/workspace_count --create -t int -s 1
          OnlyShowIn=XFCE;

    - name: Enable edge and corner snapping when dragging XFCE windows
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-window-snapping.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Enable XFCE window snapping
          Exec=sh -c "xfconf-query -c xfwm4 -p /general/wrap_windows --create -t bool -s false && xfconf-query -c xfwm4 -p /general/tile_on_move --create -t bool -s true"
          OnlyShowIn=XFCE;

    - name: Apply the stars wallpaper in the user's XFCE session
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-wallpaper.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Set desktop wallpaper
          Exec=/usr/local/bin/codex-xfce-wallpaper
          OnlyShowIn=XFCE;

    - name: Set i3lock as the user's XFCE screen locker
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-lock-command.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Configure XFCE screen lock
          Exec=xfconf-query -c xfce4-session -p /general/LockCommand --create -t string -s "/usr/bin/i3lock -c 202020"
          OnlyShowIn=XFCE;

    - name: Disable XFCE idle locking, sleep, and display power-off
      ansible.builtin.copy:
        dest: ~/.config/autostart/codex-idle-power.desktop
        mode: '0644'
        content: |
          [Desktop Entry]
          Type=Application
          Name=Configure idle power settings
          Exec=/usr/local/bin/codex-xfce-idle-power
          OnlyShowIn=XFCE;

- name: Configure rxvt-unicode for the desktop user
  become_user: "{{ local_username }}"
  block:
    - name: Create the XFCE and urxvt configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
      loop:
        - ~/.config/xfce4
        - ~/.urxvt/ext

    - name: Install the resize-font Perl extension
      ansible.builtin.copy:
        src: urxvt/resize-font
        dest: ~/.urxvt/ext/resize-font
        mode: '0644'

    - name: Set the urxvt X resources
      ansible.builtin.blockinfile:
        path: ~/.Xresources
        create: true
        marker: "! {mark} ANSIBLE MANAGED BLOCK: urxvt"
        block: "{{ lookup('ansible.builtin.file', 'urxvt/Xresources') }}"

    - name: Set urxvt as the preferred XFCE terminal
      ansible.builtin.lineinfile:
        path: ~/.config/xfce4/helpers.rc
        create: true
        regexp: '^\s*TerminalEmulator\s*='
        line: TerminalEmulator=urxvt
        insertbefore: BOF
