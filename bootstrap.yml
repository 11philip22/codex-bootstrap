---
- name: Bootstrap the local Linux machine
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  vars:
    local_username: codex

  tasks:
    - name: Configure the local user
      ansible.builtin.import_tasks: tasks/codex-user.yml

    - name: Install packages
      ansible.builtin.import_tasks: tasks/packages.yml

    - name: Configure the Codex service
      ansible.builtin.import_tasks: tasks/codex-service.yml
